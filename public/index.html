<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23d97757'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%2310a37f' fill-opacity='.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="9" fill="#d97757"/><circle cx="20" cy="16" r="9" fill="#10a37f" fill-opacity=".85"/></svg>
      <span>Duo</span><small>LOCAL</small>
    </div>

    <button class="new-task" id="newTask"><span>New task</span><kbd>N</kbd></button>

    <section class="accounts" id="accounts" aria-label="Accounts"></section>

    <div class="side-title cap">Tasks</div>
    <nav class="task-list" id="taskList"></nav>
    <button class="pal-hint" id="palHint" type="button"><span>Command palette</span><kbd id="palKbd">Ctrl K</kbd></button>
  </aside>

  <main class="main" id="main">
    <header class="topbar" id="topbar"></header>
    <div class="stage" id="stage"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="proj" id="proj" hidden></div>
      <textarea id="prompt" rows="1" placeholder="Describe a task for both agents..." aria-label="Task prompt"></textarea>
      <div class="team-roles" id="teamRoles" hidden>
        <label class="role claude"><i></i><span>Claude Code takes</span><input id="roleClaude" placeholder="Backend: API routes, database, auth" spellcheck="false"></label>
        <button type="button" class="swap" id="swapRoles" title="Swap assignments" aria-label="Swap assignments"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10M10 2l3 3-3 3M13 11H3M6 8l-3 3 3 3"/></svg></button>
        <label class="role codex"><i></i><span>Codex takes</span><input id="roleCodex" placeholder="Frontend: pages, components, styling" spellcheck="false"></label>
      </div>
      <div class="composer-row">
        <div class="seg kind" role="group" aria-label="Collaboration">
          <button type="button" class="on" data-kind="compete" title="Both agents solve the same task separately, in isolated branches. Compare and pick.">Compete</button>
          <button type="button" data-kind="team" title="Agents split the work in one shared project and message each other.">Team</button>
        </div>
        <div class="chips compete-only" role="group" aria-label="Agents">
          <button type="button" class="chip claude on" data-agent="claude" aria-pressed="true"><i></i>Claude Code</button>
          <button type="button" class="chip codex on" data-agent="codex" aria-pressed="true"><i></i>Codex</button>
        </div>
        <div class="seg compete-only" role="group" aria-label="Mode">
          <button type="button" class="on" data-mode="build" title="Agents may edit files and run commands in their own sandboxed branch">Build</button>
          <button type="button" data-mode="review" title="Read-only: agents can inspect and plan but not change anything">Plan</button>
        </div>
        <label class="repo" title="Git repository the agents will work on">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.22.78 14 1.75 14h12.5c.97 0 1.75-.78 1.75-1.75v-6.5A1.75 1.75 0 0 0 14.25 4H8L6.4 2.4A1.75 1.75 0 0 0 5.16 2z"/></svg>
          <input id="repo" list="recentRepos" spellcheck="false" aria-label="Repository path">
          <datalist id="recentRepos"></datalist>
          <span class="repo-badge" id="repoBadge"></span>
        </label>
        <button type="button" class="proj-btn" id="projBtn" title="Open, clone or create a project">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Projects</button>
        <div class="spacer"></div>
        <button class="run" id="runBtn" type="submit"><span>Run</span><kbd id="runKbd">Ctrl Enter</kbd></button>
      </div>
    </form>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
